<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Ô nhập có nhãn + thông báo lỗi; dùng bên trong <form th:object="..."> -->
<div th:fragment="field(label, name, type)" class="mb-3">
	<label class="form-label" th:for="${name}" th:text="${label}">Nhãn</label>
	<input class="form-control" th:type="${type}" th:field="*{__${name}__}"
	       th:classappend="${#fields.hasErrors(name)} ? 'is-invalid'">
	<div class="invalid-feedback" th:if="${#fields.hasErrors(name)}" th:id="${name} + '-error'"
	     th:text="${#fields.errors(name)[0]}">Lỗi</div>
</div>

<!-- Lỗi chung của form (không gắn với trường nào) -->
<div th:fragment="globalErrors" th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" id="form-error">
	<div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Lỗi</div>
</div>

</body>
</html>
