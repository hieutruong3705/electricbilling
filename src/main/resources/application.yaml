spring:
  application:
    name: electricbilling
  datasource:
    # Đổi bằng biến môi trường: DB_URL, DB_USERNAME, DB_PASSWORD
    url: ${DB_URL:jdbc:mysql://localhost:3306/electricbilling?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    # SMTP phát triển (ví dụ MailHog/smtp4dev). Tài khoản: SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000
  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 30m

app:
  # Tài khoản quản trị tạo lần đầu khi chưa có ADMIN nào
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
  # Tác vụ nhắc nợ hằng ngày
  reminder:
    cron: "0 0 8 * * *"
